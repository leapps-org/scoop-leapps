name: Pull Requests

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

jobs:
  pullRequestHandler:
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: ScoopInstaller/GithubActions@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
